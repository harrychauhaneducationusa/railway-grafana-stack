apiVersion: 1

groups:

  # ── Railway Billing ──────────────────────────────────────────────────────
  - orgId: 1
    name: Railway Billing
    folder: mockcoach-ai
    interval: 5m
    rules:

      - uid: railway-spend-warning
        title: "Railway Spend > 80% of Compute Limit"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: grafana_prometheus
            model:
              expr: "railway_current_usage_usd"
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { params: [40], type: gt }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "Railway compute spend is above $40 (80% of $50 limit)"
          description: "Current spend: {{ $values.B.Value | printf \"%.2f\" }} USD"
        labels:
          severity: warning
        isPaused: false

      - uid: railway-spend-critical
        title: "Railway Spend > 90% of Compute Limit"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: grafana_prometheus
            model:
              expr: "railway_current_usage_usd"
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { params: [45], type: gt }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "CRITICAL: Railway compute spend is above $45 (90% of $50 limit)"
          description: "Current spend: {{ $values.B.Value | printf \"%.2f\" }} USD. Approaching hard limit!"
        labels:
          severity: critical
        isPaused: false

      - uid: railway-agent-spend-warning
        title: "Railway Agent Spend > 80% of Agent Limit"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: grafana_prometheus
            model:
              expr: "railway_agent_usage_usd"
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { params: [16], type: gt }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "Railway agent spend is above $16 (80% of $20 limit)"
          description: "Agent spend: {{ $values.B.Value | printf \"%.2f\" }} USD"
        labels:
          severity: warning
        isPaused: false

      - uid: railway-billing-scrape-failed
        title: "Railway Billing Scrape Failed"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: grafana_prometheus
            model:
              expr: "railway_billing_scrape_success"
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { params: [1], type: lt }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: Alerting
        execErrState: Alerting
        for: 10m
        annotations:
          summary: "Railway billing exporter is failing to scrape the Railway API"
          description: "Check the railway-billing-exporter service logs."
        labels:
          severity: warning
        isPaused: false

  # ── API Health ───────────────────────────────────────────────────────────
  - orgId: 1
    name: API Health
    folder: mockcoach-ai
    interval: 1m
    rules:

      - uid: api-high-error-rate
        title: "API Error Rate > 5%"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: grafana_prometheus
            model:
              expr: "sum(rate(http_requests_total{job=~\"mockcoach.*\",status=~\"5..\"}[5m])) / sum(rate(http_requests_total{job=~\"mockcoach.*\"}[5m])) * 100"
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { params: [5], type: gt }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: OK
        execErrState: Alerting
        for: 3m
        annotations:
          summary: "API 5xx error rate is above 5%"
          description: "Error rate: {{ if $values.B }}{{ $values.B.Value | printf \"%.1f\" }}{{ else }}0.0{{ end }}%"
        labels:
          severity: critical
        isPaused: false

      - uid: api-high-latency
        title: "API p95 Latency > 2s"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: grafana_prometheus
            model:
              expr: "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=~\"mockcoach.*\"}[5m])) by (le))"
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { params: [2], type: gt }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "API p95 response latency is above 2 seconds"
          description: "p95 latency: {{ $values.B.Value | printf \"%.2f\" }}s"
        labels:
          severity: warning
        isPaused: false

      - uid: api-down
        title: "API Service Down"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: grafana_prometheus
            model:
              expr: "up{job=\"mockcoach-ai\"}"
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { params: [1], type: lt }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: "MockCoach API is DOWN — Prometheus cannot scrape it"
          description: "Check the mockcoach-ai service in Railway."
        labels:
          severity: critical
        isPaused: false

  # ── Worker Health ────────────────────────────────────────────────────────
  - orgId: 1
    name: Worker Health
    folder: mockcoach-ai
    interval: 1m
    rules:

      # App exports mockcoach_worker_* (not bullmq_jobs_*). Wrong names →
      # empty vectors → DatasourceNoData / "%!f(<nil>)%".
      - uid: worker-high-failure-rate
        title: "Worker Job Failure Rate > 10%"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: grafana_prometheus
            model:
              expr: "(sum(rate(mockcoach_worker_jobs_total{status=\"failed\"}[5m])) or vector(0)) / clamp_min((sum(rate(mockcoach_worker_jobs_total[5m])) or vector(0)), 1e-9) * 100"
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { params: [10], type: gt }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "BullMQ worker job failure rate is above 10%"
          description: "Failure rate: {{ if $values.B }}{{ $values.B.Value | printf \"%.1f\" }}{{ else }}0.0{{ end }}%"
        labels:
          severity: warning
        isPaused: false

      - uid: worker-queue-backlog
        title: "Worker Queue Backlog > 500 jobs"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: grafana_prometheus
            model:
              expr: "sum(mockcoach_worker_queue_depth)"
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { params: [500], type: gt }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: OK
        execErrState: Alerting
        for: 10m
        annotations:
          summary: "BullMQ queue backlog is above 500 waiting jobs"
          description: "Waiting jobs: {{ if $values.B }}{{ $values.B.Value }}{{ else }}0{{ end }}"
        labels:
          severity: warning
        isPaused: false

  # ── Infrastructure ───────────────────────────────────────────────────────
  - orgId: 1
    name: Infrastructure
    folder: mockcoach-ai
    interval: 1m
    rules:

      # Railway Redis often has maxmemory=0 (unlimited). Dividing used/max then
      # yields +Inf (or used/1 via clamp_min) → absurd "%"/always firing.
      # When max is set: alert on >80% of maxmemory. When unset: absolute 400MiB.
      - uid: redis-memory-high
        title: "Redis Memory Usage > 80%"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: grafana_prometheus
            model:
              expr: "(redis_memory_max_bytes > 0 and (redis_memory_used_bytes / redis_memory_max_bytes) > bool 0.8) or (redis_memory_max_bytes == 0 and redis_memory_used_bytes > bool (400 * 1024 * 1024))"
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "Redis memory usage high"
          description: "Used memory is >80% of maxmemory, or >400MiB while maxmemory is unset (0)."
        labels:
          severity: warning
        isPaused: false

      # Never divide a label-less sum by pg_settings_max_connections without
      # scalar()/on() — empty vector → DatasourceNoData / "%!f(<nil>)%".
      - uid: postgres-connections-high
        title: "Postgres Active Connections > 80%"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: grafana_prometheus
            model:
              expr: "sum(pg_stat_activity_count{datname=\"railway\"}) / scalar(pg_settings_max_connections) * 100"
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { params: [80], type: gt }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "Postgres connection pool is above 80% capacity"
          description: "Connection usage: {{ if $values.B }}{{ $values.B.Value | printf \"%.1f\" }}{{ else }}0.0{{ end }}%"
        labels:
          severity: warning
        isPaused: false

      - uid: postgres-exporter-down
        title: "Postgres Exporter Down"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: grafana_prometheus
            model:
              expr: "up{job=\"postgres-exporter\"}"
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { params: [1], type: lt }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: Alerting
        execErrState: Alerting
        for: 3m
        annotations:
          summary: "Postgres exporter is unreachable"
          description: "Prometheus cannot scrape postgres-exporter. Postgres metrics are unavailable."
        labels:
          severity: critical
        isPaused: false

# ── Contact Points ───────────────────────────────────────────────────────────
contactPoints:
  - orgId: 1
    name: email-admin
    receivers:
      - uid: email-admin-receiver
        type: email
        settings:
          addresses: admin@synmoraai.com
          singleEmail: false
        disableResolveMessage: false

# ── Notification Policies ────────────────────────────────────────────────────
policies:
  - orgId: 1
    receiver: email-admin
    group_by: ['grafana_folder', 'alertname']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: email-admin
        matchers:
          - severity = critical
        group_wait: 10s
        group_interval: 2m
        repeat_interval: 1h
      - receiver: email-admin
        matchers:
          - severity = warning
        group_wait: 1m
        group_interval: 10m
        repeat_interval: 6h
