# Configuration file version
# See here fore more information on configuration:
# https://grafana.com/docs/grafana/latest/administration/provisioning/#example-data-source-configuration-file
apiVersion: 1

# Mark provisioned data sources for deletion if they are no longer in a provisioning file.
prune: false

# List of data sources to insert/update depending on what's available.
datasources:
  - name: Loki
    type: loki
    access: direct
    orgId: 1
    uid: grafana_lokiq
    url: $LOKI_INTERNAL_URL
    user:
    database:
    basicAuth:
    basicAuthUser:
    withCredentials:
    isDefault: true
  - name: Prometheus
    type: prometheus
    access: proxy
    orgId: 1
    uid: grafana_prometheus
    url: $PROMETHEUS_INTERNAL_URL
    user:
    database:
    basicAuth:
    basicAuthUser:
    withCredentials:
    isDefault: false
  - name: Tempo
    type: tempo
    access: proxy
    orgId: 1
    uid: grafana_tempo
    url: $TEMPO_INTERNAL_URL
    user:
    database:
    basicAuth:
    basicAuthUser:
    withCredentials:
    isDefault: false
  # Used by 05–08 business dashboards (PostHog placeholders) until a real analytics DS exists
  - name: TestData
    type: testdata
    access: proxy
    orgId: 1
    uid: grafana_testdata
    editable: true
    isDefault: false
  - name: MockCoach Postgres
    type: postgres
    access: proxy
    orgId: 1
    uid: grafana_mockcoach_pg
    url: $PGHOST:$PGPORT
    user: $PGUSER
    secureJsonData:
      password: $PGPASSWORD
    jsonData:
      database: $PGDATABASE
      # Railway internal Postgres often works with prefer; use require only if you need strict TLS
      sslmode: prefer
      postgresVersion: 1500
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    editable: true
    isDefault: false