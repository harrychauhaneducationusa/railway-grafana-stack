global:
  scrape_interval: 15s # Default scrape interval

# Targets use Railway private DNS: <service-name>.railway.internal:<port>
# Service names must match Settings → name for each service (canvas labels like
# postgres-exporter-LLuc). Port must be the process listen port (usually Railway PORT).
# Docs: https://docs.railway.com/private-networking

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'postgres-exporter'
    scheme: http
    metrics_path: /metrics
    static_configs:
      - targets: ['postgres-exporter-lluc.railway.internal:9187']

  - job_name: 'redis-exporter'
    scheme: http
    metrics_path: /metrics
    static_configs:
      # One exporter; extra Redis instances need extra targets or exporters if you want each scraped.
      - targets: ['redis-exporter-fu0b.railway.internal:9121']

  # mockcoach-ai — production API (GET /metrics on Express).
  # When mockcoach-ai has METRICS_BEARER_TOKEN set, set the same value on this
  # Prometheus service; entrypoint.sh writes /etc/prometheus/secrets/mockcoach-ai-bearer at start.
  # Targets __MOCKCOACH_AI_SCRAPE_TARGET__ / __MOCKCOACH_WORKER_SCRAPE_TARGET__ are rewritten at
  # container start from MOCKCOACH_AI_METRICS_TARGET / MOCKCOACH_WORKER_METRICS_TARGET (host:port).
  - job_name: 'mockcoach-ai'
    scheme: http
    metrics_path: /metrics
    bearer_token_file: /etc/prometheus/secrets/mockcoach-ai-bearer
    static_configs:
      - targets: ['__MOCKCOACH_AI_SCRAPE_TARGET__']

  # mockcoach-worker-prod — BullMQ workers (GET /metrics on worker health server).
  - job_name: 'mockcoach-worker-prod'
    scheme: http
    metrics_path: /metrics
    static_configs:
      - targets: ['__MOCKCOACH_WORKER_SCRAPE_TARGET__']

  # - job_name: 'example_api'
  #   scheme: http
  #   static_configs:
  #     - targets: ['example_api:9091']

  # ── Railway billing exporter ──────────────────────────────────────────────
  - job_name: 'railway-billing-exporter'
    scheme: https
    metrics_path: '/metrics'
    scrape_interval: 300s
    static_configs:
      - targets: ['railway-billing-exporter-production.up.railway.app']
        labels:
          service: 'railway-billing-exporter'
          environment: 'production'
